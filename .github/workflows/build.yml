name: Build BioNexus

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: 1. Récupérer le code
      uses: actions/checkout@v4

    - name: 2. Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Installer les librairies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 numpy matplotlib scipy
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 4. Compiler pour Windows
      if: matrix.os == 'windows-latest'
      run: >
        pyinstaller 
        --name "BioNexus" 
        --noconsole 
        --onefile 
        --windowed 
        --icon="logo.ico"
        --add-data "logo.png;." 
        main.py

    - name: 4. Compiler pour Mac
      if: matrix.os == 'macos-latest'
      run: >
        pyinstaller 
        --name "BioNexus" 
        --noconsole 
        --onefile 
        --windowed 
        --add-data "logo.png:." 
        main.py

    - name: 5. Mettre à disposition la version Windows
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BioNexus-Windows
        path: dist/

    - name: 5. Mettre à disposition la version Mac
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: BioNexus-Mac
        path: dist/